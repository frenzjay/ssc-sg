<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Aq Theme Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --dynamic-border: #16a34a; --ssc-gold: #d97706; --brand-black: #000000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Press Start 2P', cursive; color: var(--brand-black); background-color: #111; overflow-y: auto; }
        .bg-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient( 45deg, #222, #222 10px, #111 10px, #111 20px ); z-index: 1; }
        .layout-wrapper { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .capture-area { background: rgba(255, 255, 255, 0.95); border: 6px solid var(--dynamic-border); box-shadow: 10px 10px 0px var(--ssc-gold); width: 100%; max-width: 500px; padding: 25px; box-sizing: border-box; }
        .logo-box { text-align: center; margin-bottom: 15px; }
        .logo-box img { width: 70px; height: 70px; border: 4px solid var(--brand-black); background: #fff; border-radius: 50%; object-fit: cover; }
        h2 { text-align: center; font-size: 0.9rem; margin: 5px 0 15px 0; text-transform: uppercase; line-height: 1.5; }
        #total-votes { text-align: center; font-size: 0.6rem; color: var(--ssc-gold); margin-bottom: 20px; }
        .result-item { margin-bottom: 15px; }
        .result-label { display: flex; justify-content: space-between; font-size: 0.55rem; margin-bottom: 5px; text-transform: uppercase; }
        .bar-container { width: 100%; background: #ddd; height: 15px; border: 3px solid var(--brand-black); box-sizing: border-box; }
        .bar-fill { height: 100%; background: var(--dynamic-border); width: 0%; transition: width 1s ease-out; }

        button { background: var(--ssc-gold); color: white; border: 4px solid var(--brand-black); padding: 15px; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 500px; margin-top: 25px; transition: all 0.2s; box-sizing: border-box; box-shadow: 6px 6px 0px var(--brand-black); }
        button:hover { background: #b45309; transform: translate(-2px, -2px); box-shadow: 8px 8px 0px var(--brand-black); }
        
        #loading { text-align: center; font-size: 0.7rem; color: #fff; position: relative; z-index: 10; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="layout-wrapper">
        <h2 id="loading">LOADING TALLY...</h2>

        <div id="results-card" class="capture-area" style="display: none;">
            <div class="logo-box"><img src="../logo.jpg" alt="SSC Logo"></div>
            <h2>OFFICIAL TALLY</h2>
            <div id="total-votes">TOTAL VOTES: 0</div>
            <div id="results-container">
                </div>
        </div>

        <button id="downloadBtn" style="display: none;">Save</button>
    </div>

    <script>
        const RESULTS_API_URL = 'https://itzfrenz.7m.pl/calendar/acquaintanceVoteResults.php';

        const themeData = {
            'y2k': { color: '#ec4899', label: 'Y2K Vibes' },
            'coachella': { color: '#e07a5f', label: 'Coachella' },
            'barbie': { color: '#ff69b4', label: 'Barbie & Ken' },
            'biniverse': { color: '#38bdf8', label: 'Bini-verse' },
            'rock90s': { color: '#dc2626', label: 'Rock of the 90s' },
            'inferno': { color: '#ff4500', label: 'Single\'s Inferno' },
            'tequila': { color: '#ea580c', label: 'Tequila Sunrise' },
            'denim': { color: '#2563eb', label: 'Denim & Diamond' },
        };

        fetch(RESULTS_API_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if(data.status === 'success') {
                    document.getElementById('results-card').style.display = 'block';
                    document.getElementById('downloadBtn').style.display = 'block';
                    document.getElementById('total-votes').innerText = `TOTAL VOTES: ${data.total}`;

                    const container = document.getElementById('results-container');
                    
                    data.data.forEach(item => {
                        const themeInfo = themeData[item.theme] || { color: '#16a34a', label: item.theme };
                        const percentage = data.total > 0 ? ((item.votes / data.total) * 100).toFixed(1) : 0;
                        
                        const itemHtml = `
                            <div class="result-item">
                                <div class="result-label" style="color: ${themeInfo.color}">
                                    <span>${themeInfo.label}</span>
                                    <span>${item.votes} (${percentage}%)</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-fill" style="background-color: ${themeInfo.color}; width: ${percentage}%"></div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += itemHtml;
                    });
                } else {
                    document.getElementById('loading').innerText = "ERROR LOADING RESULTS.";
                    document.getElementById('loading').style.display = 'block';
                }
            })
            .catch(error => {
                document.getElementById('loading').innerText = "CONNECTION ERROR.";
                document.getElementById('loading').style.color = "#dc2626";
            });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.innerText = "GENERATING...";
            
            const targetElement = document.getElementById('results-card');
            
            html2canvas(targetElement, { 
                scale: 2, 
                backgroundColor: "#ffffff",
                useCORS: true
            }).then(canvas => {
                const imageURI = canvas.toDataURL("image/png");
                const link = document.createElement("a");
                link.download = "ssc_aq_results.png";
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                btn.innerText = originalText;
            });
        });
    </script>
</body>
</html>
