<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Acquaintance Theme Voting - CLOSED</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --dynamic-border: #dc2626; --ssc-gold: #d97706; --brand-black: #000000; }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100%; 
            font-family: 'Press Start 2P', cursive; 
            color: var(--brand-black); 
            background-color: var(--brand-black); 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .bg-layer { 
            position: fixed; 
            top: -10%; 
            left: -10%; 
            width: 120%; 
            height: 120%; 
            background-size: cover; 
            background-position: center center; 
            background-repeat: no-repeat; 
            z-index: 1; 
            filter: blur(80px) saturate(200%);
        }
        
        #bg-layer-1 { opacity: 1; background-image: url('back.jpeg'); } 
        
        .container { 
            position: relative; 
            width: 90%; 
            max-width: 500px; 
            margin: 40px 0;
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(5px); 
            border: 6px solid var(--dynamic-border); 
            box-shadow: 10px 10px 0px var(--ssc-gold); 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            padding: 35px 25px; 
            box-sizing: border-box; 
        }

        .logo-box { text-align: center; margin-bottom: 25px; }
        .logo-box img { width: 70px; height: 70px; border: 4px solid var(--brand-black); background: #fff; border-radius: 50%; object-fit: cover; }
        
        #response-msg { text-align: center; display: block; }
        #response-msg h2 { font-size: 1.1rem; margin: 10px 0 20px 0; text-transform: uppercase; line-height: 1.5; color: var(--dynamic-border); }
        #response-msg p { font-size: 0.7rem; line-height: 1.8; color: var(--brand-black); }
    </style>
</head>
<body>

    <div id="bg-layer-1" class="bg-layer"></div>

    <div class="container">
        <div class="logo-box"><img src="../logo.jpg" alt="SSC Logo"></div>

        <div id="response-msg">
            <h2>VOTING CLOSED!</h2>
            <p>Thank you for your participation.</p>
            <br>
            <p>The theme voting for the SSC Acquaintance Party has officially concluded.</p>
        </div>
    </div>

</body>
</html>
